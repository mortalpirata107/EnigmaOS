name: 'Release EnigmaOS'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            unzip \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            wmctrl \
            libgtk-3-dev \
            libcairo2-dev \
            libgtk-layer-shell-dev \
            libwayland-dev \
            wayland-protocols \
            patchelf \
            libfuse2

      - name: Install Vosk Speech Library (libvosk.so)
        run: |
          mkdir -p ~/.local/lib ~/.local/include
          wget -q https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip
          unzip -q vosk-linux-x86_64-0.3.45.zip
          sudo cp vosk-linux-x86_64-0.3.45/libvosk.so /usr/lib/
          sudo cp vosk-linux-x86_64-0.3.45/libvosk.so /usr/local/lib/
          sudo cp vosk-linux-x86_64-0.3.45/vosk_api.h /usr/include/
          cp vosk-linux-x86_64-0.3.45/libvosk.so ~/.local/lib/
          cp vosk-linux-x86_64-0.3.45/vosk_api.h ~/.local/include/
          sudo ldconfig

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Release ${{ github.ref_name }}
            
            Descarga el paquete para tu distribución:
            - **AppImage:** Ejecutable universal para cualquier distribución Linux.
            - **DEB:** Instalador para Ubuntu, Debian, Pop!_OS, Linux Mint.
            
            #### Instalación Rápida
            ```bash
            curl -fsSL https://raw.githubusercontent.com/mortalpirata107/EnigmaOS/main/install.sh | bash
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
